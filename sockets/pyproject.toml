[project]
name = "hermes-socket-nodes"
dynamic = ["version"]
description = "Hermes nodes for socket transports (UDP, TCP)"
authors = [{ name = "floris vernieuwe", email = "floris@vernieuwe.eu" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "node-hermes-core",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402"]

[tool.ruff]
line-length = 120
exclude = ["**.pyi", "**/.venv/**"]
include = ["src/**.py", "test/**.py"]

[tool.pyright]
ignore = ["**.pyi", "**/.venv/**"]

[build-system]
requires = ["uv-dynamic-versioning"]
build-backend = "uv_dynamic_versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv.build-backend]
module-name = "hermes_socket_nodes"
module-root = "src"
