[project]
name = "hermes-framing-nodes"
dynamic = ["version"]
description = "Hermes nodes for byte-stream framing protocols (COBS, Burst-Link, ...)"
authors = [{ name = "floris vernieuwe", email = "floris@vernieuwe.eu" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "node-hermes-core",
    # COBS + CRC16 are everything the BURST wire format needs; we re-implement
    # encode/decode in pure Python rather than pulling in burst-link-protocol
    # (which ships a C extension that fights this dev environment's lack of
    # a system compiler). The submodule under ./burst-link-protocol stays as
    # the canonical reference; the wire format matches.
    "cobs>=1.2.1",
    "crc>=7.1.0",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402"]

[tool.ruff]
line-length = 120
exclude = ["**.pyi", "**/.venv/**"]
include = ["src/**.py", "test/**.py"]

[tool.pyright]
ignore = ["**.pyi", "**/.venv/**"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { root = ".." }
